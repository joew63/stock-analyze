name: Morning digest

on:
  schedule:
    # 7:00 a.m. America/New_York. GitHub cron is UTC with no DST handling, so
    # both the EDT (11:00 UTC) and EST (12:00 UTC) equivalents are listed; the
    # --expect-hour guard in the script lets only the run that lands on 7 a.m.
    # Eastern actually send. Weekdays only (trading days).
    - cron: "0 11 * * 1-5"
    - cron: "0 12 * * 1-5"

concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send morning digest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DIGEST_GMAIL_USER: ${{ secrets.DIGEST_GMAIL_USER }}
          DIGEST_GMAIL_APP_PASSWORD: ${{ secrets.DIGEST_GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
        run: npx tsx scripts/run-digest.ts --expect-hour=7

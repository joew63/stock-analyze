version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e FINNHUB_API_KEY -e FMP_API_KEY -e DIGEST_SENDER_EMAIL -e DIGEST_RECIPIENT_EMAIL -e DIGEST_AWS_REGION -e DIGEST_CRON_SECRET >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
